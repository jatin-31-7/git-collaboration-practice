<!DOCTYPE html>
<html>
<head>
  <title>RTRS Passenger Sign In</title>
</head>
<body>
  <h1>RTRS - Passenger Sign In</h1>
  <form action="/signin" method="post">
    <input type="text" name="mobile" placeholder="10-digit mobile number" required pattern="[0-9]{10}">
    <input type="password" name="password" placeholder="Password" required minlength="8">
    <button type="submit">Sign In</button>
  </form>
</body>
</html>
